name: IndexNow

on:
  push:
    branches: [main]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs after the key is live
        run: |
          set -euo pipefail
          keyfile=$(find . -maxdepth 1 -regextype posix-extended -regex './[a-f0-9]{32}\.txt' -printf '%f\n')
          key="${keyfile%.txt}"
          live=""
          for _ in 1 2 3 4 5 6 7 8; do
            body=$(curl -fsS "https://gurusoftware.studio/${key}.txt" || true)
            if [ "$body" = "$key" ]; then
              live=1
              break
            fi
            sleep 30
          done
          if [ -z "$live" ]; then
            echo "IndexNow key is not live at https://gurusoftware.studio/${key}.txt yet"
            exit 1
          fi
          python3 - "$key" << 'PY'
          import json, re, sys, urllib.request
          from pathlib import Path
          key = sys.argv[1]
          urls = re.findall(r"<loc>(.*?)</loc>", Path("sitemap.xml").read_text())
          body = {
              "host": "gurusoftware.studio",
              "key": key,
              "keyLocation": f"https://gurusoftware.studio/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              print(res.status, res.read()[:200])
          PY
